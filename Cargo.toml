[package]
name = "mocra"
version = "0.6.0"
edition = "2024"
description = "A distributed, event-driven crawling and data collection framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ouiex/mocra"
homepage = "https://github.com/ouiex/mocra"
documentation = "https://docs.rs/mocra"
readme = "README.md"
rust-version = "1.95"
keywords = ["crawler", "distributed", "queue", "scraping", "framework"]
categories = ["network-programming", "asynchronous", "web-programming"]
exclude = [
	"target/**",
	"data/**",
	"logs/**",
	"docker-compose.kafka.yml",
	"scripts/**",
	"benchmarks/**",
	".github/**",
	".idea/**",
	".cargo/**",
	".claude/**",
	"*.log",
]

# Feature set for docs.rs builds: covers every feature worth documenting, but **excludes** js-v8
# (embedded C++ v8 build) and queue-kafka (rdkafka needs librdkafka's C build) — both are prone to
# build failures on docs.rs and have a very small public surface.
[package.metadata.docs.rs]
features = ["store", "dashboard", "cluster-embedded", "queue-nats", "polars", "excel"]
rustdoc-args = ["--cfg", "docsrs"]


[dependencies]
# Runtime, domain models, proxy pool, and DAG scheduling.
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
log = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v7", "zerocopy", "v4"] }
dashmap = "6"
zstd = "0.13"
flate2 = "1.1.9"
metrics = "0.24"
chrono = { version = "0.4.43", features = ["serde"] }
regex = "1"
md5 = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["http2", "charset", "native-tls", "brotli", "form", "cookies", "json", "socks", "gzip", "deflate", "zstd", "hickory-dns", "stream"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time", "json"] }
tracing-log = "0.2"
cron = "0.15"
indexmap = { version = "2", features = ["serde"] }
reqwest_cookie_store = { version = "0.10", features = ["serde"] }
url = "2"
toml = "0.9"
rand = "0.9.2"
semver = { version = "1", features = ["serde"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
dyn-clone = "1"
rmp-serde = "1.3"
serde_path_to_error = "0.1"
crc32fast = "1.5.0"
bloomfilter = "3"
metrics-exporter-prometheus = "0.18"
sysinfo = "0.38"
time = { version = "0.3", features = ["formatting", "parsing"] }
# Global allocator (enabled by the default `mimalloc` feature).
mimalloc = { version = "0.1", default-features = false, optional = true }
# Feature-gated optional dependencies.
openraft = { version = "0.9", features = ["serde", "storage-v2"], optional = true }
redb = { version = "2", optional = true }
axum = { version = "0.8", features = ["json"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
sea-orm = { version = "1", features = ["macros", "with-json", "with-chrono", "with-uuid", "postgres-array", "runtime-tokio-native-tls", "sqlx-postgres", "sqlx-sqlite"], optional = true }
rdkafka = { version = "0.39", features = ["cmake-build"], optional = true }
async-nats = { version = "0.38", optional = true }
calamine = { version = "0.33.0", features = ["chrono", "dates"], optional = true }
v8 = { version = "145", optional = true }                          # js-v8: embedded JS runtime
# The prelude re-exports Polars types so downstream versions stay aligned.
# Polars 0.54 IPC streaming also requires its parquet feature.
polars = { version = "0.54.4", features = ["json", "lazy", "serde", "csv", "timezones", "strings", "ipc", "parquet", "dtype-decimal"], optional = true }
polars-lazy = { version = "0.54.4", features = ["pivot"], optional = true }
polars-ops = { version = "0.54.4", features = ["pivot"], optional = true }

[dev-dependencies]
# Tests / examples only; never enters downstream users' dependency trees.
scraper = "0.27"                                 # examples: HTML parsing (CSS selectors)
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true


[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
# Embedded JS (v8) runtime: lets the facade/examples run JS parsing scripts alongside Lua.
js-v8 = ["dep:v8"]
# DataFrame support (polars): unlocks `DataFrameStore` and re-exports
# `::polars::*` from the prelude.
polars = ["dep:polars", "dep:polars-lazy", "dep:polars-ops"]
# Excel parsing (calamine → DataFrame); implies polars.
excel = ["polars", "dep:calamine"]
# Data-plane Kafka queue backend (off by default — avoids rdkafka's cmake/C++ build burden).
queue-kafka = ["dep:rdkafka"]
# Data-plane NATS (JetStream) queue backend — lightweight, a good fit for an embedded cluster's
# data plane.
queue-nats = ["dep:async-nats"]
# Database / multi-tenant metadata store (sea-orm). Off by default — the DB-less standalone mode
# does not need it; enabling it unlocks the DB-driven account × platform × module task model.
store = ["dep:sea-orm"]
# Admin dashboard: once enabled, the engine exposes the admin + observability HTTP API
# (task / cluster / metrics monitoring).
dashboard = ["dep:tower-http", "dep:axum"]
# Embedded redb+Raft control plane. Once enabled, `RaftCoordinationBackend` implements
# `CoordinationBackend`, so a self-forming Raft cluster can handle coordination
# (locks / election / KV).
cluster-embedded = ["dep:openraft", "dep:redb", "dep:axum"]

[lib]
name = "mocra"
path = "src/lib.rs"

# Facade quickstart (single-node, no DB).
[[example]]
name = "spider_quickstart"
path = "examples/spider_quickstart.rs"

# Custom downloader (implement the Downloader trait to replace/extend the default reqwest one).
[[example]]
name = "custom_downloader"
path = "examples/custom_downloader.rs"

# Offline follow-up request example: GET -> POST with headers, body, and cookies.
[[example]]
name = "follow_request"
path = "examples/follow_request.rs"

# Proxy manager lifecycle without external network access.
[[example]]
name = "proxy_pool"
path = "examples/proxy_pool.rs"

# Spider with a request-specific proxy; requires a reachable proxy supplied via env.
[[example]]
name = "explicit_proxy"
path = "examples/explicit_proxy.rs"

# Embedded cluster example: requires cluster-embedded (it uses `ClusterConfig`).
[[example]]
name = "cluster_quickstart"
path = "examples/cluster_quickstart.rs"
required-features = ["cluster-embedded"]

# Admin dashboard example: requires dashboard (it uses `.dashboard(port)`).
[[example]]
name = "dashboard"
path = "examples/dashboard.rs"
required-features = ["dashboard"]

# End-to-end example against a real site (quotes.toscrape.com): fetch → parse → store.
# Pagination follow-through + detail-page fan-out + deduplication + typed output + a custom
# DataSink writing to disk; the dashboard feature is optional.
[[example]]
name = "quotes_scraper"
path = "examples/quotes_scraper.rs"

[[example]]
name = "quotes_project"
path = "examples/quotes_project.rs"
