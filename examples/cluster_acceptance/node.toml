name = "{{NAMESPACE}}"

[db]

[download_config]
downloader_expire = 3600
timeout = 20
rate_limit = 0.0
enable_session = false
enable_locker = false
enable_rate_limit = false
cache_ttl = 60
wss_timeout = 30
max_response_size = 1048576

[cache]
ttl = 60

[crawler]
node_id = "node-{{NODE_ID}}"
request_max_retries = 2
task_max_errors = 100
module_max_errors = 100
module_locker_ttl = 5
task_concurrency = 4
publish_concurrency = 4
parser_concurrency = 4
error_task_concurrency = 4
idle_stop_secs = 0

[channel_config]
minid_time = 1
capacity = 256
nack_max_retries = 2
nack_backoff_ms = 100

[channel_config.nats]
url = "nats://nats:4222"

[channel_config.blob_storage]
path = "/blobs"
shared_path = true

[api]
port = 12800
api_key = "mocra-local-acceptance"

[event_bus]
capacity = 4096

[logger]
enabled = true
level = "info"
format = "text"

[[logger.outputs]]
type = "console"
